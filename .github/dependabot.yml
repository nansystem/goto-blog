version: 2
updates:
  # npm (Astro)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
      time: '00:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    reviewers:
      - nansystem
    assignees:
      - nansystem
    labels:
      - dependencies
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      # @astrojs/check が TS7 未対応のため typescript の major 更新は保留（対応後に削除）
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # ランタイム依存の minor/patch を1PRに集約（major は個別PR）
      production-minor-patch:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      # devDependencies の minor/patch を1PRに集約（major は個別PR）
      development-minor-patch:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
      time: '00:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    reviewers:
      - nansystem
    assignees:
      - nansystem
    labels:
      - dependencies
    commit-message:
      prefix: fix
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
